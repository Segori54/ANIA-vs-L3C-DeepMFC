[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "afc-thesis-lab"
version = "0.1.0"
description = "Reproducible acoustic-feedback cancellation experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.scripts]
afc-lab = "afc_lab.cli:main"

[tool.setuptools]
packages = ["afc_lab"]
